name: Release QA
on:
  pull_request:
  push:
    branches: [main, 'redesign/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contracts
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-release-evidence
          path: test-results/
          retention-days: 14
