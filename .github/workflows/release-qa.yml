name: Release QA
on:
  pull_request:
  push:
    branches: [main, 'redesign/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:contracts
      - run: npm test
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.browser }}-release-evidence
          path: test-results/
          retention-days: 14
